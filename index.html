<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Небосвод</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1a1a2e;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .button {
            display: block;
            background-color: #4a86ff;
            color: white;
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            transition: background-color 0.2s;
            border: none;
            width: 100%;
            cursor: pointer;
        }
        .button:hover {
            background-color: #3a6fd8;
        }
        .button.secondary {
            background-color: #e2e8f0;
            color: #333;
        }
        .button.secondary:hover {
            background-color: #cbd5e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Небосвод</h1>
        <p>Выберите интересующий вас раздел</p>

        <button class="button" onclick="alert('Здесь будет каталог товаров')">🛒 Товары</button>
        <button class="button" onclick="alert('Здесь будут услуги')">🛠 Услуги</button>
        <button class="button secondary" onclick="alert('Информация о нас')">ℹ️ О нас</button>
        <button class="button secondary" onclick="alert('Контакты')">📞 Прямая связь</button>
    </div>
</body>
</html>
