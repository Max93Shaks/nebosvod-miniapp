<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Небосвод</title>
    <style>
        /* Стили */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        /* Шапка с картинкой */
        .header-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 3px solid #4a86ff;
        }
        .header-text {
            padding: 15px 20px;
            background: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1a1a2e;
            border-bottom: 1px solid #e2e8f0;
        }
        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #f0f4f8;
            color: #333;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .btn:hover { background-color: #e2e8f0; }
        .btn.primary {
            background-color: #4a86ff;
            color: white;
            justify-content: center;
        }
        .btn.primary:hover { background-color: #3a6fd8; }
        .btn.back {
            background-color: transparent;
            color: #4a86ff;
            justify-content: center;
            margin-top: auto;
        }
        .btn.back:hover { background-color: #f0f4f8; }
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; flex: 1; }
        
        /* Стили для карточек товаров (Авито) */
        .product-card {
            display: flex;
            background: #f8fafc;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            border-color: #4a86ff;
        }
        .product-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .product-info {
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .product-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .product-price {
            color: #4a86ff;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ВСТАВЬТЕ СЮДА ССЫЛКУ НА ВАШУ КАРТИНКУ -->
        <img src="https://raw.githubusercontent.com/Max93Shaks/nebosvod-miniapp/main/welcome.jpg" alt="Небосвод" class="header-image">
        <div class="header-text">Добро пожаловать в Небосвод!</div>

        <div class="content">
            <!-- ЭКРАН: ГЛАВНОЕ МЕНЮ -->
            <div id="screen-main" class="screen active">
                <p style="margin-bottom: 10px; color: #666; text-align: center;">
                    Мы работаем на рынке товаров и услуг уже 14 лет!<br>
                    Предоставляем гарантию качества.
                </p>
                <button class="btn" onclick="showScreen('screen-products')">🛒 Товары</button>
                <button class="btn" onclick="alert('Здесь будут услуги')">🛠 Услуги</button>
                <button class="btn" onclick="alert('Информация о нас')">ℹ️ О нас</button>
                <button class="btn" onclick="alert('Контакты')">📞 Прямая связь</button>
            </div>

            <!-- ЭКРАН: ТОВАРЫ -->
            <div id="screen-products" class="screen">
                <h2 style="font-size: 18px; margin-bottom: 10px; color: #1a1a2e;">Раздел «Товары»</h2>
                <button class="btn" onclick="showScreen('screen-doors')">🚪 Двери</button>
                <button class="btn" onclick="alert('Окна (в разработке)')">🪟 Окна</button>
                <button class="btn" onclick="alert('Потолки (в разработке)')">🪞 Потолки</button>
                <button class="btn back" onclick="showScreen('screen-main')">⬅️ Назад в главное меню</button>
            </div>

            <!-- ЭКРАН: ДВЕРИ (С товарами) -->
            <div id="screen-doors" class="screen">
                <h2 style="font-size: 18px; margin-bottom: 10px; color: #1a1a2e;">Двери</h2>
                
                <!-- Карточка товара 1 (Замените ссылки на свои) -->
                <a href="https://www.avito.ru/novosibirsk/remont_i_stroitelstvo/vhodnye_dveri_v_kvartiru_8136342838" target="_blank" class="product-card">
                    <img src="https://b00.img.avito.st/image/1/1.QNIq6ba47DscXm42JpwukTxJ7j2USG4tHEXuOZpA5DGc.qH-xerVqDsvkP7rJ4gefmAlcjZntwcuWyYaBAi2z9b0?cqp=2.YN7dHnrK-mhyvtTBpyubvaFoUVdTM3W7BFy5YaeXzZ_Q2glMrBb_s4irqaJhHlfJPgeDGUqVXQ==" alt="Дверь 1" class="product-image">
                    <div class="product-info">
                        <div class="product-title">Входная дверь Alpine</div>
                        <div class="product-price">20 300 ₽</div>
                    </div>
                </a>

                <!-- Карточка товара 2 -->
                <a href="https://www.avito.ru/novosibirsk/remont_i_stroitelstvo/mezhkomnatnye_dveri_8136263055" target="_blank" class="product-card">
                    <img src="https://60.img.avito.st/image/1/1.gBIa0ra4LPssZa72FpjpXQxyLv2kc67tLH4u-ap7JPGs.sBHxE5D0H06lOrixUUiIJtqoybFsUPvNPEw_amPF_zc" alt="Дверь 2" class="product-image">
                    <div class="product-info">
                        <div class="product-title">Межкомнатная дверь Loft</div>
                        <div class="product-price">7 200 ₽</div>
                    </div>
                </a>

                <button class="btn back" onclick="showScreen('screen-products')">⬅️ Назад к товарам</button>
            </div>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
