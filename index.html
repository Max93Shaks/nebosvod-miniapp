<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#100d0c">
    <title>Небосвод — Mini App</title>
    <style>
      :root {
        font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
        color: #fff;
        background: #1D2939;
        font-synthesis: none;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        min-height: 100vh;
      }
      
      button,input,textarea,select {
        font: inherit;
      }
      
      button {
        cursor: pointer;
      }
      
      a {
        color: #D5A45B;
      }
      
      .app {
        max-width: 640px;
        margin: auto;
        min-height: 100vh;
        padding: calc(18px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom));
      }
      
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
      }
      
      .back {
        background: #344054;
        border: 1px solid #465569;
        color: white;
        border-radius: 13px;
        padding: 10px 14px;
        min-width: 64px;
      }
      
      .back:disabled {
        opacity: .45;
      }
      
      .brand {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: .03em;
      }
      
      .brand small {
        display: block;
        font-size: 11px;
        letter-spacing: .18em;
        color: #D5A45B;
        font-weight: 700;
      }
      
      .hero {
        padding: 26px 20px;
        border: 1px solid #536073;
        border-radius: 24px;
        background: linear-gradient(140deg,#344054,#1d2939 70%);
        margin: 8px 0 25px;
      }
      
      .hero .mark {
        font-size: 39px;
        color: #D5A45B;
      }
      
      .hero h1 {
        font-size: 29px;
        margin: 9px 0;
      }
      
      .muted {
        color: #c3cbd7;
        line-height: 1.55;
      }
      
      .eyebrow {
        color: #D5A45B;
        text-transform: uppercase;
        letter-spacing: .14em;
        font-size: 11px;
        font-weight: 800;
      }
      
      .title {
        font-size: 25px;
        margin: 5px 0 18px;
      }
      
      .stack {
        display: grid;
        gap: 13px;
      }
      
      .tile,.product,.partner,.panel {
        background: #344054;
        border: 1px solid #465569;
        border-radius: 18px;
        overflow: hidden;
      }
      
      .tile {
        width: 100%;
        text-align: left;
        color: #fff;
        padding: 21px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 19px;
        font-weight: 750;
      }
      
      .tile span:last-child {
        color: #D5A45B;
        font-size: 23px;
      }
      
      .tile small {
        display: block;
        font-size: 13px;
        font-weight: 400;
        color: #cbd3df;
        margin-top: 5px;
      }
      
      .product .photo {
        height: 205px;
        background: #263344;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8b98a9;
        font-size: 14px;
      }
      
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      
      .product .details {
        padding: 17px;
      }
      
      .product h3,.partner h3 {
        margin: 0 0 7px;
        font-size: 19px;
      }
      
      .meta {
        color: #c4cedb;
        font-size: 13px;
      }
      
      .price {
        color: #D5A45B;
        font-size: 21px;
        font-weight: 800;
        margin: 11px 0;
      }
      
      .btn {
        border: 0;
        border-radius: 13px;
        background: #D5A45B;
        color: #1D2939;
        padding: 15px 18px;
        font-weight: 800;
        width: 100%;
        text-align: center;
      }
      
      .btn.secondary {
        background: #445369;
        color: white;
        border: 1px solid #65738a;
      }
      
      .btn:disabled {
        opacity: .6;
        cursor: default;
      }
      
      .btnline {
        display: grid;
        gap: 10px;
        margin-top: 15px;
      }
      
      .form {
        display: grid;
        gap: 17px;
      }
      
      .field label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }
      
      .field input,.field textarea {
        width: 100%;
        padding: 14px;
        background: #29374a;
        border: 1px solid #65738a;
        border-radius: 12px;
        color: #fff;
        outline: none;
      }
      
      .field input:focus,.field textarea:focus {
        border-color: #D5A45B;
      }
      
      .field textarea {
        min-height: 104px;
        resize: vertical;
      }
      
      .field.error input,.field.error textarea {
        border-color: #ff9292;
      }
      
      .error-text {
        color: #ffabab;
        font-size: 12px;
        margin-top: 6px;
      }
      
      .hint {
        font-size: 12px;
        color: #c4cedb;
        margin-top: 5px;
      }
      
      .choice {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(120px,1fr));
        gap: 8px;
      }
      
      .choice button {
        background: #29374a;
        border: 1px solid #65738a;
        color: white;
        padding: 14px 8px;
        border-radius: 12px;
      }
      
      .choice button.selected {
        border-color: #D5A45B;
        background: #584a35;
        color: #ffe1ab;
      }
      
      .summary {
        background: #263344;
        padding: 14px;
        border-radius: 13px;
        color: #d6deea;
        line-height: 1.55;
      }
      
      .notice {
        padding: 13px;
        border-radius: 12px;
        background: #59383d;
        color: #ffe0e0;
      }
      
      .success {
        text-align: center;
        padding: 55px 10px;
      }
      
      .success .check {
        font-size: 58px;
        color: #D5A45B;
      }
      
      .success h2 {
        font-size: 28px;
      }
      
      .gallery {
        position: relative;
      }
      
      .gallery img {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 18px;
      }
      
      .gallery-controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 12px;
      }
      
      .gallery-controls button {
        background: #344054;
        border: 0;
        color: #fff;
        border-radius: 10px;
        padding: 8px 18px;
      }
      
      .partner img {
        width: 100%;
        height: 190px;
        object-fit: cover;
      }
      
      .partner .details {
        padding: 17px;
      }
      
      .legal {
        font-size: 12px;
        line-height: 1.5;
        color: #c3cbd7;
        margin-top: 14px;
      }
      
      .legal button {
        border: 0;
        background: none;
        color: #D5A45B;
        text-decoration: underline;
        padding: 0;
      }
      
      .footer {
        margin-top: 36px;
        text-align: center;
        color: #8997a9;
        font-size: 12px;
      }
      
      .empty {
        padding: 30px 15px;
        text-align: center;
        background: #344054;
        border-radius: 18px;
        color: #cbd3df;
      }
      
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #1D2939;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin .7s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      
      }
      
      .privacy {
        line-height: 1.65;
        color: #d4dbe6;
      }
      
      .privacy h3 {
        color: #D5A45B;
      }
      
      .privacy p {
        margin-bottom: 16px;
      }
      
      .tag {
        font-size: 12px;
        color: #D5A45B;
      }
      
      .load {
        margin-top: 18px;
      }
      
      .contact {
        display: grid;
        gap: 12px;
      }
      
      .contact a {
        text-decoration: none;
      }
      
      .skeleton {
        padding: 20px;
        text-align: center;
        color: #cbd3df;
      }

      /* NEBOSVOD — golden cosmos visual theme. Existing JS and API remain unchanged. */
      :root { color-scheme: dark; --space:#100d0c; --panel:#211a18; --panel2:#2e231d; --gold:#f4c34d; --gold-soft:#d6a451; --line:rgba(236,182,84,.26); --ink:#fff8eb; --muted:#d3c3ac; background:var(--space); color:var(--ink); }
      html { background:var(--space); }
      body { background: radial-gradient(ellipse at 75% 0%,rgba(161,94,19,.27),transparent 42%), radial-gradient(ellipse at 5% 35%,rgba(107,59,18,.18),transparent 50%), #100d0c; }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.65; background-image:radial-gradient(1px 1px at 12% 15%,#ffe3a1 90%,transparent),radial-gradient(1px 1px at 74% 27%,#ffd478 90%,transparent),radial-gradient(2px 2px at 46% 65%,#dba64a 90%,transparent),radial-gradient(1px 1px at 88% 83%,#fff1cc 90%,transparent),radial-gradient(1px 1px at 28% 89%,#ffc55b 90%,transparent); background-size:173px 181px,211px 239px,307px 269px,257px 293px,359px 311px; }
      .app { position:relative; z-index:1; padding-top:calc(20px + env(safe-area-inset-top)); }
      .header { margin-bottom:20px; }
      .brand { color:#fff9ed; text-shadow:0 1px 14px rgba(255,188,58,.18); }
      .brand small,.eyebrow,.tag { color:var(--gold); }
      .back,.gallery-controls button { background:#2d241e; border:1px solid var(--line); color:var(--ink); }
      .hero { position:relative; overflow:hidden; padding:24px 20px 27px; border:1px solid rgba(244,195,77,.42); background:radial-gradient(ellipse at 75% 30%,rgba(223,139,29,.32),transparent 62%),linear-gradient(140deg,#332315,#15100f 75%); box-shadow:0 10px 38px rgba(0,0,0,.22),inset 0 1px rgba(255,219,139,.08); }
      .hero::after { content:""; position:absolute; width:230px; height:85px; right:-90px; top:40px; border-radius:50%; background:rgba(243,173,44,.12); filter:blur(30px); pointer-events:none; }
      .hero-logo { display:block; width:min(100%,320px); height:auto; margin:0 0 12px -4px; border-radius:10px; mix-blend-mode:screen; }
      .hero .mark { color:var(--gold); }
      .hero h1 { font-size:clamp(25px,6vw,32px); line-height:1.18; }
      .muted,.meta,.hint,.legal,.privacy,.footer { color:var(--muted); }
      .tile,.product,.partner,.panel { background:linear-gradient(155deg,rgba(53,39,29,.96),rgba(30,24,23,.97)); border:1px solid var(--line); box-shadow:0 7px 20px rgba(0,0,0,.12); }
      .tile { transition:transform .15s,border-color .15s; }
      .tile:active { transform:scale(.985); }
      .tile span:last-child,.price { color:var(--gold); }
      .tile small { color:#d4c3ad; }
      .product .photo { background:#1b1613; color:#aa9780; }
      .btn { background:linear-gradient(115deg,#ffe078,#f3bc3d 68%,#e8a82e); color:#25180a; box-shadow:0 3px 16px rgba(227,162,42,.16); }
      .btn.secondary { background:#352920; color:#fff4e0; border:1px solid rgba(244,195,77,.4); box-shadow:none; }
      .field input,.field textarea,.choice button { background:#211b19; border:1px solid rgba(231,187,115,.37); color:#fff9ed; }
      .field input:focus,.field textarea:focus,.choice button.selected { border-color:var(--gold); }
      .choice button.selected { background:#58401d; color:#ffe7a8; }
      .summary,.empty { background:#281f1b; color:#e5d7c3; border:1px solid var(--line); }
      .notice { background:#4c2827; }
      .gallery img { border:1px solid var(--line); }
      .success .check,.privacy h3,.legal button,a { color:var(--gold); }
      .spinner { border-color:#2a1d0a; border-top-color:transparent; }
      :focus-visible { outline:2px solid #ffe078; outline-offset:3px; }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; animation:none !important; } }
    
      /* Обновлённая приветственная часть */
      .header .brand:has(small:first-child) { font-size: 0; }
      .header .brand small { font-size: 11px; line-height: 1.5; }
      .hero h1 { font-size: clamp(21px, 5.1vw, 27px); line-height: 1.32; }
      .hero-benefits { margin: 20px 0 18px; padding-left: 20px; color: #f4e5c8; font-size: 15px; line-height: 1.55; }
      .hero-benefits li { padding-left: 3px; margin: 0 0 9px; }
      .hero-benefits li::marker { color: #f2bf45; }
      .hero-tagline { margin: 20px 0 0; color: #e9c881; font-size: 13px; font-style: italic; line-height: 1.6; text-align: center; }
      .hero-tagline span { white-space: nowrap; color: #ffd253; font-style: normal; }
      .header .home-nav {flex:1;min-width:0;padding:13px 17px;border:1px solid rgba(244,195,77,.65);border-radius:13px;background:linear-gradient(110deg,#ffe078,#f3bc3d);color:#25180a;font-weight:800;font-size:15px;cursor:pointer}
  .header .back {flex:0 0 auto;min-width:78px;padding:13px 11px}
  .header .home-nav:disabled {opacity:.55}
  .photo-pick {width:100%;padding:12px;border:1px dashed var(--gold);border-radius:12px;color:var(--ink);background:var(--panel)}
  .contact-links {display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 22px}
  .contact-links a {color:var(--gold);font-weight:700}
  .doors-banner { display:block; width:min(100%, 320px); max-width:320px; height:auto; margin:12px 0; border-radius:10px; }

.about-link {display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--gold);border-radius:14px;text-decoration:none;color:inherit;background:rgba(15,20,38,.75);min-height:76px;box-sizing:border-box}
.about-link img {width:56px;height:56px;flex:0 0 56px;object-fit:contain;border-radius:9px;background:#fff}
.about-link span {font-size:14px;line-height:1.35}
.about-link .about-arrow {margin-left:auto;color:var(--gold);font-size:24px}
.consent-row{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5}.consent-row input{width:20px;height:20px;flex:none;accent-color:var(--gold);margin:2px 0}.consent-row button{font:inherit}.consent-block{margin:0}.privacy{overflow-wrap:anywhere}
</style>

      const services = [['measure','Записаться на замер'],['estimate','Предварительный расчёт'],['windowRepair','Ремонт окна']];
      const state = { page: 'home', stack: [], data: null, loading: false, error: '', catalogs: {}, partners: { items: [], page: 0, more: true }, product: null, slide: 0, form: null, formValues: {}, errors: {}, sending: false, sendError: '', successId: '', privacyFrom: null };
      const app = document.getElementById('app'); const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const text = (s) => escapeHTML(s); const money = p => p === null || p === undefined || p === '' ? 'Уточняйте цену' : new Intl.NumberFormat('ru-RU').format(Number(p)) + ' ₽';
      const key = (page, data) => page + ':' + (typeof data === 'string' ? data : JSON.stringify(data || ''));
      function go(page, data = null, opts = {}) { if (!opts.replace) { state.stack.push({ page: state.page, data: state.data, scroll: window.scrollY }); } state.page = page; state.data = data; state.error = ''; state.errors = {}; render(); window.scrollTo(0, 0); if (page === 'catalog' || (page === 'section' && data === 'stretchCeilings')) loadCatalog(data); if (page === 'partners') { state.partners = { items: [], page: 0, more: true }; loadPartners() } if (page === 'product') loadProduct(data) }

      function home() { if (state.photoBusy || state.sending) return; state.stack = []; state.page = 'home'; state.data = null; state.form = null; state.formValues = {}; render(); window.scrollTo(0, 0) }

      async function submitOrder() { if (state.sending || state.photoBusy) return; if (!validate()) { render(); const first = Object.keys(state.errors)[0]; app.querySelector(`[data-field="${first}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return } state.sending = true; state.sendError = ''; render(); const t = state.data, v = state.formValues; const payload = { type: t, name: v.name.trim(), phone: formatPhone(v.phone), comment: (v.comment || '').trim(), idempotency_key: state.requestKey, consent: true, consent_version: '1.0' }; const signedMaxData = maxInitData(); if (signedMaxData) payload.max_init_data = signedMaxData; if (t === 'product') Object.assign(payload, { product_id: state.product.id, product_name: state.product.title || state.product.name, category: state.product.category }); if (v.address) payload.address = v.address.trim(); if (t === 'measure') Object.assign(payload, { measure_type: v.measure_type, measure_other: (v.measure_other || '').trim(), preferred_date: v.date, preferred_time: v.time.trim() }); if (v.installation_type) payload.installation_type = v.installation_type; if (v.repair_type) payload.repair_type = v.repair_type; if (t === 'estimate') payload.estimate_type = v.estimate_type; if (t === 'windowRepair') payload.photos = state.repairPhotos || []; if (t === 'ceiling') Object.assign(payload, { area_m2: Number(v.area.replace(',', '.')), corners: Number(v.corners) }); try { const r = await request('/api/order', { method: 'POST', body: JSON.stringify(payload), timeout: t === 'windowRepair' ? 90000 : 30000, headers: { 'Idempotency-Key': state.requestKey } }); const id = r.order_id ?? r.id ?? r.number; if (!id) throw Error('Сервер не вернул номер заявки'); state.successId = id; state.sending = false; state.page = 'success'; state.data = null; state.stack = []; render(); window.scrollTo(0, 0) } catch (e) { state.sendError = e.name === 'AbortError' ? 'Сервер не ответил вовремя. Попробуйте повторить отправку.' : 'Не удалось подтвердить отправку заявки. Попробуйте ещё раз.'; state.sending = false; render() } }
      app.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (!el) return; const action = el.dataset.action, arg = el.dataset.arg; if (state.photoBusy) return; if (action === 'clear-repair-photos') { if (!state.sending) { state.repairPhotos = []; state.photoError = ''; render(); } } else if (action === 'back') back(); else if (action === 'home') home(); else if (action === 'go') go(arg); else if (action === 'section') go('section', arg); else if (action === 'catalog') go('catalog', arg); else if (action === 'product') go('product', arg); else if (action === 'form') startForm(arg); else if (action === 'productOrder') startForm('product'); else if (action === 'moreCatalog') loadCatalog(state.data); else if (action === 'morePartners') loadPartners(); else if (action === 'slidePrev') { state.slide = (state.slide + photos(state.product).length - 1) % photos(state.product).length; render() } else if (action === 'slideNext') { state.slide = (state.slide + 1) % photos(state.product).length; render() } else if (action === 'choose') { state.formValues[el.dataset.name] = arg; delete state.errors[el.dataset.name]; render() } else if (action === 'external') window.open(safeUrl(arg), '_blank', 'noopener,noreferrer'); else if (action === 'privacy' || action === 'consent') { if (!state.sending && !state.photoBusy) go(action) } });
      app.addEventListener('input', e => { const name = e.target.dataset.input; if (!name) return; let value = e.target.value; if (name === 'phone') { value = formatPhone(value); e.target.value = value } state.formValues[name] = value; if (state.errors[name]) { const old = state.errors[name]; validate(); if (!state.errors[name]) { const wrap = e.target.closest('.field'); wrap.classList.remove('error'); wrap.querySelector('.error-text')?.remove() } else state.errors[name] = old } });
      async function compressRepairPhoto(file) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        const canvas = document.createElement('canvas');
        try {
          await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = () => reject(new Error('Формат фото не поддерживается. Выберите JPG, PNG или WebP.')); img.src = url; });
          const scale = Math.min(1, 2560 / Math.max(img.naturalWidth, img.naturalHeight));
          let w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
          for (let pass = 0; pass < 5; pass++) {
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            if (!ctx) throw new Error('Не удалось обработать фото.');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
            for (const quality of [0.85, 0.75, 0.65, 0.55]) {
              const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
              if (blob && blob.type === 'image/jpeg' && blob.size <= 3*1024*1024) {
                return await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob); });
              }
            }
            w = Math.max(1, Math.round(w * 0.8)); h = Math.max(1, Math.round(h * 0.8));
          }
          throw new Error('Не удалось уменьшить фото до 3 МБ.');
        } finally { URL.revokeObjectURL(url); canvas.width = canvas.height = 0; }
      }
      app.addEventListener('change', async e => {
        if (e.target.id === 'pd-consent') { state.formValues.consent = e.target.checked; const btn = app.querySelector('#order-form button[type=submit]'); if (btn) btn.disabled = state.sending || state.photoBusy || !e.target.checked; return; }
        if (e.target.id !== 'repair-photos' || state.photoBusy || state.sending) return;
        const files = Array.from(e.target.files || []), form = state.formValues;
        state.photoError = '';
        if (files.length > 3 || files.some(f => !f.size || f.size > 30*1024*1024)) { state.photoError = 'Выберите до 3 фотографий, не более 30 МБ каждая. Предыдущий выбор сохранён.'; render(); return; }
        state.photoBusy = true; render();
        try {
          const photos = [];
          for (const file of files) photos.push(await compressRepairPhoto(file));
          if (state.formValues === form) state.repairPhotos = photos;
        } catch (err) { if (state.formValues === form) state.photoError = (err instanceof Error ? err.message : 'Не удалось обработать фотографии.') + ' Предыдущий выбор сохранён.'; }
        finally { if (state.formValues === form) { state.photoBusy = false; render(); } }
      });
      app.addEventListener('submit', e => { if (e.target.id === 'order-form') { e.preventDefault(); submitOrder() } });
      // Auto-load further pages near the bottom; explicit "Показать ещё" is a fallback.
      let scrollPending = false; window.addEventListener('scroll', () => { if (scrollPending) return; scrollPending = true; requestAnimationFrame(() => { scrollPending = false; if (document.documentElement.scrollHeight - window.scrollY - window.innerHeight < 500) { if (state.page === 'catalog') loadCatalog(state.data); if (state.page === 'partners') loadPartners() } }) });
      // Back from privacy retains the form values; ordinary back from an order form clears them.
      const oldBack = back; back = function () { if (['privacy','consent'].includes(state.page) && state.stack.length) { const prev = state.stack.pop(); state.page = prev.page; state.data = prev.data; state.error = ''; render(); requestAnimationFrame(() => window.scrollTo(0, prev.scroll || 0)); return } oldBack() };
      render();
    </script>
