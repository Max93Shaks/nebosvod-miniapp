<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#1D2939">
    <title>Небосвод — Mini App</title>
    <style>
      :root {
        font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
        color: #fff;
        background: #1D2939;
        font-synthesis: none;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        min-height: 100vh;
      }
      
      button,input,textarea,select {
        font: inherit;
      }
      
      button {
        cursor: pointer;
      }
      
      a {
        color: #D5A45B;
      }
      
      .app {
        max-width: 640px;
        margin: auto;
        min-height: 100vh;
        padding: calc(18px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom));
      }
      
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
      }
      
      .back {
        background: #344054;
        border: 1px solid #465569;
        color: white;
        border-radius: 13px;
        padding: 10px 14px;
        min-width: 64px;
      }
      
      .back:disabled {
        opacity: .45;
      }
      
      .brand {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: .03em;
      }
      
      .brand small {
        display: block;
        font-size: 11px;
        letter-spacing: .18em;
        color: #D5A45B;
        font-weight: 700;
      }
      
      .hero {
        padding: 26px 20px;
        border: 1px solid #536073;
        border-radius: 24px;
        background: linear-gradient(140deg,#344054,#1d2939 70%);
        margin: 8px 0 25px;
      }
      
      .hero .mark {
        font-size: 39px;
        color: #D5A45B;
      }
      
      .hero h1 {
        font-size: 29px;
        margin: 9px 0;
      }
      
      .muted {
        color: #c3cbd7;
        line-height: 1.55;
      }
      
      .eyebrow {
        color: #D5A45B;
        text-transform: uppercase;
        letter-spacing: .14em;
        font-size: 11px;
        font-weight: 800;
      }
      
      .title {
        font-size: 25px;
        margin: 5px 0 18px;
      }
      
      .stack {
        display: grid;
        gap: 13px;
      }
      
      .tile,.product,.partner,.panel {
        background: #344054;
        border: 1px solid #465569;
        border-radius: 18px;
        overflow: hidden;
      }
      
      .tile {
        width: 100%;
        text-align: left;
        color: #fff;
        padding: 21px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 19px;
        font-weight: 750;
      }
      
      .tile span:last-child {
        color: #D5A45B;
        font-size: 23px;
      }
      
      .tile small {
        display: block;
        font-size: 13px;
        font-weight: 400;
        color: #cbd3df;
        margin-top: 5px;
      }
      
      .product .photo {
        height: 205px;
        background: #263344;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8b98a9;
        font-size: 14px;
      }
      
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      
      .product .details {
        padding: 17px;
      }
      
      .product h3,.partner h3 {
        margin: 0 0 7px;
        font-size: 19px;
      }
      
      .meta {
        color: #c4cedb;
        font-size: 13px;
      }
      
      .price {
        color: #D5A45B;
        font-size: 21px;
        font-weight: 800;
        margin: 11px 0;
      }
      
      .btn {
        border: 0;
        border-radius: 13px;
        background: #D5A45B;
        color: #1D2939;
        padding: 15px 18px;
        font-weight: 800;
        width: 100%;
        text-align: center;
      }
      
      .btn.secondary {
        background: #445369;
        color: white;
        border: 1px solid #65738a;
      }
      
      .btn:disabled {
        opacity: .6;
        cursor: default;
      }
      
      .btnline {
        display: grid;
        gap: 10px;
        margin-top: 15px;
      }
      
      .form {
        display: grid;
        gap: 17px;
      }
      
      .field label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }
      
      .field input,.field textarea {
        width: 100%;
        padding: 14px;
        background: #29374a;
        border: 1px solid #65738a;
        border-radius: 12px;
        color: #fff;
        outline: none;
      }
      
      .field input:focus,.field textarea:focus {
        border-color: #D5A45B;
      }
      
      .field textarea {
        min-height: 104px;
        resize: vertical;
      }
      
      .field.error input,.field.error textarea {
        border-color: #ff9292;
      }
      
      .error-text {
        color: #ffabab;
        font-size: 12px;
        margin-top: 6px;
      }
      
      .hint {
        font-size: 12px;
        color: #c4cedb;
        margin-top: 5px;
      }
      
      .choice {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(120px,1fr));
        gap: 8px;
      }
      
      .choice button {
        background: #29374a;
        border: 1px solid #65738a;
        color: white;
        padding: 14px 8px;
        border-radius: 12px;
      }
      
      .choice button.selected {
        border-color: #D5A45B;
        background: #584a35;
        color: #ffe1ab;
      }
      
      .summary {
        background: #263344;
        padding: 14px;
        border-radius: 13px;
        color: #d6deea;
        line-height: 1.55;
      }
      
      .notice {
        padding: 13px;
        border-radius: 12px;
        background: #59383d;
        color: #ffe0e0;
      }
      
      .success {
        text-align: center;
        padding: 55px 10px;
      }
      
      .success .check {
        font-size: 58px;
        color: #D5A45B;
      }
      
      .success h2 {
        font-size: 28px;
      }
      
      .gallery {
        position: relative;
      }
      
      .gallery img {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 18px;
      }
      
      .gallery-controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 12px;
      }
      
      .gallery-controls button {
        background: #344054;
        border: 0;
        color: #fff;
        border-radius: 10px;
        padding: 8px 18px;
      }
      
      .partner img {
        width: 100%;
        height: 190px;
        object-fit: cover;
      }
      
      .partner .details {
        padding: 17px;
      }
      
      .legal {
        font-size: 12px;
        line-height: 1.5;
        color: #c3cbd7;
        margin-top: 14px;
      }
      
      .legal button {
        border: 0;
        background: none;
        color: #D5A45B;
        text-decoration: underline;
        padding: 0;
      }
      
      .footer {
        margin-top: 36px;
        text-align: center;
        color: #8997a9;
        font-size: 12px;
      }
      
      .empty {
        padding: 30px 15px;
        text-align: center;
        background: #344054;
        border-radius: 18px;
        color: #cbd3df;
      }
      
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #1D2939;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin .7s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      
      }
      
      .privacy {
        line-height: 1.65;
        color: #d4dbe6;
      }
      
      .privacy h3 {
        color: #D5A45B;
      }
      
      .privacy p {
        margin-bottom: 16px;
      }
      
      .tag {
        font-size: 12px;
        color: #D5A45B;
      }
      
      .load {
        margin-top: 18px;
      }
      
      .contact {
        display: grid;
        gap: 12px;
      }
      
      .contact a {
        text-decoration: none;
      }
      
      .skeleton {
        padding: 20px;
        text-align: center;
        color: #cbd3df;
      }
    </style>
  </head>
  <body><main class="app" id="app"></main>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      'use strict';
      // Set window.NEBOSVOD_API_BASE before this script, or leave blank for same-origin /api routes.
      const API = 'https://shstest.ru';
      // Signed MAX launch data; backend must verify it before identifying the customer.
      function maxInitData() {
        const bridgeData = window.WebApp && typeof window.WebApp.initData === 'string' ? window.WebApp.initData : '';
        return bridgeData || new URLSearchParams(location.hash.slice(1)).get('WebAppData') || '';
      }
      const MAX_BOT = 'https://max.ru/se15014206_2_bot';
      const SITE = 'https://nebosvod-54.ru';
      const GIS = 'https://2gis.ru/novosibirsk/firm/70000001006158575';
      const sections = { doors: { name: 'Двери', children: ['interior', 'entrance'] }, interior: { name: 'Межкомнатные', catalog: true, measure: true }, entrance: { name: 'Входные', children: ['apartment', 'dachaDoors'] }, apartment: { name: 'В квартиру', catalog: true }, dachaDoors: { name: 'На дачу', catalog: true }, windows: { name: 'Окна', children: ['dachaWindows', 'customWindows'] }, dachaWindows: { name: 'Дачные', catalog: true }, customWindows: { name: 'Под заказ', measure: true }, hardware: { name: 'Фурнитура', children: ['hardwareCatalog'] }, hardwareCatalog: { name: 'Каталог', catalog: true, hardware: true }, stretchCeilings: { name: 'Натяжные потолки', catalog: true } };
      const services = [['measure', 'Записаться на замер'], ['windowInstall', 'Расчёт монтажа окон'], ['doorInstall', 'Расчёт монтажа дверей'], ['ceiling', 'Расчёт монтажа натяжных потолков'], ['repair', 'Ремонтные работы']];
      const state = { page: 'home', stack: [], data: null, loading: false, error: '', catalogs: {}, partners: { items: [], page: 0, more: true }, product: null, slide: 0, form: null, formValues: {}, errors: {}, sending: false, sendError: '', successId: '', privacyFrom: null };
      const app = document.getElementById('app'); const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const text = (s) => escapeHTML(s); const money = p => p === null || p === undefined || p === '' ? 'Уточняйте цену' : new Intl.NumberFormat('ru-RU').format(Number(p)) + ' ₽';
      const key = (page, data) => page + ':' + (typeof data === 'string' ? data : JSON.stringify(data || ''));
      function go(page, data = null, opts = {}) { if (!opts.replace) { state.stack.push({ page: state.page, data: state.data, scroll: window.scrollY }); } state.page = page; state.data = data; state.error = ''; state.errors = {}; render(); window.scrollTo(0, 0); if (page === 'catalog') loadCatalog(data); if (page === 'partners') { state.partners = { items: [], page: 0, more: true }; loadPartners() } if (page === 'product') loadProduct(data) }
      function back() { if (state.sending) return; const prev = state.stack.pop(); if (!prev) { go('home', null, { replace: true }); return } state.page = prev.page; state.data = prev.data; state.error = ''; state.errors = {}; state.form = null; state.formValues = {}; render(); requestAnimationFrame(() => window.scrollTo(0, prev.scroll || 0)) }
      function home() { state.stack = []; state.page = 'home'; state.data = null; state.form = null; state.formValues = {}; render(); window.scrollTo(0, 0) }
      function header(title = 'НЕБОСВОД') { return `<header class="header">${state.page === 'home' ? '' : `<button class="back" ${state.sending ? 'disabled' : ''} data-action="back">← Назад</button>`}<div class="brand">${title}<small>ДВЕРИ · ОКНА · ПОТОЛКИ · УСЛУГИ</small></div></header>` }
      const tile = (title, sub, action, arg) => `<button class="tile" data-action="${action}" data-arg="${escapeHTML(arg || '')}"><span>${text(title)}${sub ? `<small>${text(sub)}</small>` : ''}</span><span>›</span></button>`;
      function render() {  
      let body = ''; const page = state.page, d = state.data;
        if (page === 'home') body = `<div class="hero"><div class="mark">✧</div><div class="eyebrow">Новосибирск</div><h1>Небосвод</h1><div class="muted">Двери, окна, фурнитура, натяжные потолки и профессиональные услуги по замеру и монтажу.</div></div><div class="stack">${tile('Товары', 'Двери, окна, фурнитура и натяжные потолки', 'go', 'goods')}${tile('Услуги', 'Замер, монтаж и ремонт', 'go', 'services')}${tile('О нас', 'Контакты и партнёры', 'go', 'about')}</div>`;
        else if (page === 'goods') body = `<div class="eyebrow">Каталог</div><h1 class="title">Товары</h1><div class="stack">${tile('Двери', '', 'section', 'doors')}${tile('Окна', '', 'section', 'windows')}${tile('Фурнитура', '', 'section', 'hardware')}${tile('Натяжные потолки', '', 'section', 'stretchCeilings')}</div>`;
        else if (page === 'section') { const s = sections[d]; body = `<div class="eyebrow">Товары</div><h1 class="title">${text(s.name)}</h1><div class="stack">${(s.children || []).map(id => tile(sections[id].name, '', 'section', id)).join('')}${s.catalog ? tile('Посмотреть товары', '', 'catalog', d) : ''}${s.measure ? tile('Записаться на замер', '', 'form', 'measure') : ''}${s.hardware ? tile('Заказать фурнитуру', '', 'form', 'hardware') : ''}</div>` }
        else if (page === 'catalog') { const s = sections[d], c = state.catalogs[d] || { items: [], more: true, loading: false }; body = `<div class="eyebrow">Каталог</div><h1 class="title">${text(s.name)}</h1><div class="stack">${c.items.map(p => productCard(p)).join('')}</div>${c.loading ? '<div class="skeleton">Загружаем товары…</div>' : c.error ? `<div class="notice">${text(c.error)}</div><button class="btn secondary load" data-action="moreCatalog">Повторить</button>` : c.items.length === 0 ? '<div class="empty">В этой категории пока нет товаров.</div>' : ''}${c.more && !c.loading && !c.error ? '<button class="btn secondary load" data-action="moreCatalog">Показать ещё</button>' : ''}` }
        else if (page === 'product') { const p = state.product; if (!p || String(p.id) !== String(d)) body = '<div class="skeleton">Загружаем товар…</div>'; else { const pics = photos(p), src = pics[state.slide]; body = `<div class="eyebrow">Карточка товара</div><h1 class="title">${text(p.title || p.name)}</h1>${src ? `<div class="gallery"><img src="${escapeHTML(src)}" alt="Фото товара"><div class="gallery-controls">${pics.length > 1 ? `<button data-action="slidePrev">←</button><span class="meta" style="padding-top:9px">${state.slide + 1} / ${pics.length}</span><button data-action="slideNext">→</button>` : ''}</div></div>` : '<div class="empty">Фото недоступно</div>'}<p class="meta">Номер товара: ${text(p.id)}</p><div class="price">${money(p.price)}</div>${p.description ? `<p class="muted">${text(p.description)}</p>` : ''}<div class="btnline">${p.url ? `<a class="btn secondary" href="${escapeHTML(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer">${isAvito(p.url) ? 'Посмотреть на Авито' : 'Перейти на сайт'}</a>` : ''}<button class="btn" data-action="productOrder">Оставить заявку</button></div>` } }
        else if (page === 'services') body = `<div class="eyebrow">Помощь специалистов</div><h1 class="title">Услуги</h1><div class="stack">${services.map(([id, name]) => tile(name, '', 'form', id)).join('')}</div>`;
        else if (page === 'form') body = formHTML(d);
        else if (page === 'success') body = `<div class="success"><div class="check">✓</div><h2>Заявка отправлена!</h2><p class="muted">Мы получили вашу заявку. Номер заявки:</p><h2 style="color:#D5A45B">${text(state.successId)}</h2><p class="muted">Сохраните номер заявки. Уведомления в MAX пока подключаются.</p><button class="btn" data-action="home">На главную</button></div>`;
        else if (page === 'about') body = `<div class="eyebrow">О компании</div><h1 class="title">О нас</h1><p class="muted">Новосибирск, Физкультурная, 20А<br>Телефон: 8 (383) 375-91-38</p><div class="stack">${tile('Контактная связь', '', 'go', 'contacts')}${tile('Наш сайт', '', 'external', SITE)}${tile('2ГИС', '', 'external', GIS)}${tile('Наши партнёры', '', 'go', 'partners')}</div>`;
        else if (page === 'contacts') body = `<h1 class="title">Контактная связь</h1><p class="muted">Новосибирск, Физкультурная, 20А</p><div class="contact"><a class="btn" href="${MAX_BOT}" target="_blank" rel="noopener noreferrer">Написать в MAX</a><a class="btn secondary" href="tel:+73833759138">Позвонить: 8 (383) 375-91-38</a></div>`;
        else if (page === 'partners') { const p = state.partners; body = `<div class="eyebrow">Сотрудничество</div><h1 class="title">Наши партнёры</h1><div class="stack">${p.items.map(x => `<article class="partner">${x.image_url || x.image ? `<img src="${escapeHTML(x.image_url || x.image)}" alt="${text(x.name)}">` : ''}<div class="details"><h3>${text(x.name)}</h3><a class="btn" style="display:block;text-decoration:none" href="${escapeHTML(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">Официальный сайт</a></div></article>`).join('')}</div>${p.loading ? '<div class="skeleton">Загружаем партнёров…</div>' : p.error ? `<div class="notice">${text(p.error)}</div><button class="btn secondary load" data-action="morePartners">Повторить</button>` : p.items.length === 0 ? '<div class="empty">Партнёры пока не добавлены.</div>' : ''}${p.more && !p.loading && !p.error ? '<button class="btn secondary load" data-action="morePartners">Показать ещё</button>' : ''}` }
        else if (page === 'privacy') body = privacyHTML();
        app.innerHTML = header() + body + `<div class="footer">© Небосвод · Новосибирск</div>`;
      }
      function photos(p) { const a = p.photos || p.images || []; return a.map(x => typeof x === 'string' ? x : x.url || x.image_url).filter(Boolean) } function isAvito(u) { try { return new URL(u).hostname === 'avito.ru' || new URL(u).hostname.endsWith('.avito.ru') } catch { return false } } function safeUrl(u) { try { const v = new URL(u); return ['http:', 'https:'].includes(v.protocol) ? v.href : '#' } catch { return '#' } }
      function productCard(p) { const pic = photos(p)[0]; return `<article class="product"><div class="photo">${pic ? `<img loading="lazy" src="${escapeHTML(pic)}" alt="${text(p.title || p.name)}">` : 'Фото товара'}</div><div class="details"><h3>${text(p.title || p.name)}</h3><div class="meta">№ ${text(p.id)}</div><div class="price">${money(p.price)}</div><button class="btn" data-action="product" data-arg="${escapeHTML(p.id)}">Открыть товар</button></div></article>` }
      const forms = { product: { title: 'Заявка на товар' }, hardware: { title: 'Заказать фурнитуру' }, measure: { title: 'Записаться на замер' }, windowInstall: { title: 'Расчёт монтажа окон' }, doorInstall: { title: 'Расчёт монтажа дверей' }, ceiling: { title: 'Расчёт монтажа натяжных потолков' }, repair: { title: 'Ремонтные работы' } };
      function field(name, label, required = false, opts = {}) { const val = state.formValues[name] ?? '', err = state.errors[name]; return `<div class="field ${err ? 'error' : ''}" data-field="${name}"><label for="f-${name}">${label}${required ? ' *' : ''}</label>${opts.textarea ? `<textarea id="f-${name}" data-input="${name}" maxlength="${opts.max || 500}" placeholder="${text(opts.placeholder || '')}">${text(val)}</textarea>` : `<input id="f-${name}" data-input="${name}" type="${opts.type || 'text'}" value="${text(val)}" ${opts.max ? `maxlength="${opts.max}"` : ''} ${opts.min ? `min="${opts.min}"` : ''} ${opts.step ? `step="${opts.step}"` : ''} ${opts.placeholder ? `placeholder="${text(opts.placeholder)}"` : ''} ${opts.type === 'date' ? `min="${dateOffset(1)}" max="${dateOffset(30)}"` : ''}>`}${opts.max ? `<div class="hint">Максимум ${opts.max} символов</div>` : ''}${err ? `<div class="error-text">${text(err)}</div>` : ''}</div>` }
      function choices(name, label, values, required = true) { return `<div class="field ${state.errors[name] ? 'error' : ''}" data-field="${name}"><label>${label}${required ? ' *' : ''}</label><div class="choice">${values.map(v => `<button type="button" data-action="choose" data-name="${name}" data-arg="${text(v)}" class="${state.formValues[name] === v ? 'selected' : ''}">${text(v)}</button>`).join('')}</div>${state.errors[name] ? `<div class="error-text">${text(state.errors[name])}</div>` : ''}</div>` }
      function dateOffset(n) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
      function formHTML(type) {  
      let s = `<div class="eyebrow">Оформление заявки</div><h1 class="title">${text(forms[type].title)}</h1>`; if (type === 'product') { const p = state.product; s += `<div class="summary">Товар: <strong>${text(p?.title || p?.name || '')}</strong><br>Номер: ${text(p?.id || '')}</div>` } s += `<form class="form" id="order-form" novalidate>${field('name', 'Имя', true, { max: 100, placeholder: 'Как к вам обращаться' })}${field('phone', 'Телефон', true, { placeholder: '+7 (999) 999-99-99', type: 'tel', max: 18 })}`;
        if (['measure', 'windowInstall', 'doorInstall', 'ceiling', 'repair'].includes(type)) {
          if (type === 'measure') { s += choices('measure_type', 'Что нужно замерить', ['Двери', 'Окна', 'Другое']); if (state.formValues.measure_type === 'Другое') s += field('measure_other', 'Уточните, что нужно замерить', false, { max: 100 }) }
          if (type === 'windowInstall' || type === 'doorInstall') s += choices('installation_type', 'Вид изделия', ['Под заказ', 'Готовые из магазина']);
          if (type === 'repair') s += choices('repair_type', 'Направление работ', ['Окна', 'Двери', 'Потолки']);
          s += field('address', 'Адрес объекта', true, { max: 200, placeholder: 'Улица, дом, квартира' });
          if (type === 'measure') s += field('date', 'Желаемая дата', true, { type: 'date' }) + field('time', 'Желаемое время', true, { max: 100, placeholder: 'Например, 14:30 или после 16:00' });
          if (type === 'ceiling') s += field('area', 'Площадь помещения, м²', true, { type: 'text', placeholder: 'Например, 18,5' }) + field('corners', 'Количество углов', true, { type: 'number', min: 1, step: 1, placeholder: 'Например, 4' });
        }
        if (type === 'hardware') s += field('comment', 'Опишите нужную фурнитуру', true, { textarea: true, max: 500 }); else s += field('comment', 'Комментарий', false, { textarea: true, max: 500 });
        s += `${state.sendError ? `<div class="notice" role="alert">${text(state.sendError)}</div>` : ''}<button class="btn" type="submit" ${state.sending ? 'disabled' : ''}>${state.sending ? '<span class="spinner"></span>Отправляем…' : state.sendError ? 'Повторить' : 'Отправить заявку'}</button><div class="legal">Нажимая «Отправить заявку», вы соглашаетесь на <button type="button" data-action="privacy">обработку персональных данных</button>.</div></form>`; return s
      }
      function privacyHTML() { return `<div class="eyebrow">Документы</div><h1 class="title">Обработка персональных данных</h1><div class="notice">Проект документа не утверждён. До публикации необходимо заполнить реквизиты ИП и проверить текст на соответствие требованиям законодательства.</div><div class="privacy"><h3>1. Оператор</h3><p>Индивидуальный предприниматель: [ФИО ИП]. ИНН: [ИНН]. Контактные данные: [контакт для обращений].</p><h3>2. Какие данные обрабатываются</h3><p>Имя, номер телефона, адрес объекта и сведения, добровольно указанные в заявках, а также технические данные, необходимые для их обработки.</p><h3>3. Цели обработки</h3><p>Получение и обработка обращений, обратная связь, согласование замера, расчёт стоимости и выполнение заказанных работ.</p><h3>4. Порядок обработки и сроки</h3><p>[Уточнить правовые основания, состав операций, получателей, сроки хранения, меры защиты, порядок отзыва согласия и реализации прав субъектов.]</p><h3>5. Обращения</h3><p>[Указать актуальный адрес электронной почты или почтовый адрес оператора.]</p></div>` }
      async function request(path, opts = {}) { const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), opts.timeout || 15000); try { const r = await fetch(API + path, { ...opts, signal: controller.signal, headers: { ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) } }); if (!r.ok) throw Error('Ошибка сервера (' + r.status + ')'); return await r.json() } finally { clearTimeout(timer) } }
      function normalizeList(payload) { return Array.isArray(payload) ? payload : (payload.items || payload.products || payload.partners || []) }
      async function loadCatalog(id) { const c = state.catalogs[id] || (state.catalogs[id] = { items: [], page: 0, more: true }); if (c.loading || !c.more) return; c.loading = true; c.error = ''; render(); try { const r = await request('/api/products?category=' + encodeURIComponent(id) + '&limit=10&offset=' + c.items.length); const items = normalizeList(r); c.items.push(...items); c.page++; c.more = r.has_more ?? (items.length === 10) } catch (e) { c.error = 'Не удалось загрузить товары. Попробуйте ещё раз.' } finally { c.loading = false; if (state.page === 'catalog' && state.data === id) render() } }
      async function loadProduct(id) { let p = Object.values(state.catalogs).flatMap(x => x.items).find(x => String(x.id) === String(id)); state.product = p || null; state.slide = 0; render(); try { const r = await request('/api/products/' + encodeURIComponent(id)); if (state.page === 'product' && String(state.data) === String(id)) { state.product = r; render() } } catch (e) { if (!p && state.page === 'product') { app.insertAdjacentHTML('beforeend', '<div class="notice">Не удалось загрузить товар.</div>') } } }
      async function loadPartners() { const p = state.partners; if (p.loading || !p.more) return; p.loading = true; p.error = ''; render(); try { const r = await request('/api/partners?limit=10&offset=' + p.items.length); const items = normalizeList(r); p.items.push(...items); p.page++; p.more = r.has_more ?? (items.length === 10) } catch (e) { p.error = 'Не удалось загрузить партнёров. Попробуйте ещё раз.' } finally { p.loading = false; if (state.page === 'partners') render() } }
      function startForm(type) { state.form = type; state.formValues = {}; state.errors = {}; state.sendError = ''; state.requestKey = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random(); go('form', type) }
      function phoneDigits(v) { let d = String(v).replace(/\D/g, ''); if (d.startsWith('8') && d.length >= 1) d = '7' + d.slice(1); if (d.startsWith('9')) d = '7' + d; return d.slice(0, 11) } function formatPhone(v) { let d = phoneDigits(v); if (!d) return ''; if (!d.startsWith('7')) d = '7' + d.slice(1); const x = d.slice(1); return '+7' + (x.length ? ' (' + x.slice(0, 3) : '') + (x.length >= 3 ? ') ' : '') + (x.length > 3 ? x.slice(3, 6) : '') + (x.length > 6 ? '-' + x.slice(6, 8) : '') + (x.length > 8 ? '-' + x.slice(8, 10) : '') }
      function validate() { const v = state.formValues, t = state.data, e = {}; if (!v.name?.trim()) e.name = 'Укажите имя'; else if (v.name.trim().length > 100) e.name = 'Не более 100 символов'; if (!/^7\d{10}$/.test(phoneDigits(v.phone || ''))) e.phone = 'Введите российский номер из 10 цифр после +7'; if (['measure', 'windowInstall', 'doorInstall', 'ceiling', 'repair'].includes(t)) { if (!v.address?.trim()) e.address = 'Укажите адрес'; if (t === 'measure') { if (!v.measure_type) e.measure_type = 'Выберите вид замера'; if (!v.date) e.date = 'Выберите дату'; else if (v.date < dateOffset(1) || v.date > dateOffset(30)) e.date = 'Выберите дату от завтра до 30 дней вперёд'; if (!v.time?.trim()) e.time = 'Укажите желаемое время' } if (['windowInstall', 'doorInstall'].includes(t) && !v.installation_type) e.installation_type = 'Выберите вид изделия'; if (t === 'repair' && !v.repair_type) e.repair_type = 'Выберите направление'; if (t === 'ceiling') { const area = Number(String(v.area || '').replace(',', '.')); if (!Number.isFinite(area) || area <= 0) e.area = 'Введите положительную площадь'; if (!/^[1-9]\d*$/.test(String(v.corners || ''))) e.corners = 'Введите целое положительное число' } } if (t === 'hardware' && !v.comment?.trim()) e.comment = 'Опишите нужную фурнитуру'; if ((v.comment || '').length > 500) e.comment = 'Не более 500 символов'; state.errors = e; return !Object.keys(e).length }
      async function submitOrder() { if (state.sending) return; if (!validate()) { render(); const first = Object.keys(state.errors)[0]; app.querySelector(`[data-field="${first}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return } state.sending = true; state.sendError = ''; render(); const t = state.data, v = state.formValues; const payload = { type: t, name: v.name.trim(), phone: formatPhone(v.phone), comment: (v.comment || '').trim(), idempotency_key: state.requestKey }; const signedMaxData = maxInitData(); if (signedMaxData) payload.max_init_data = signedMaxData; if (t === 'product') Object.assign(payload, { product_id: state.product.id, product_name: state.product.title || state.product.name, category: state.product.category }); if (v.address) payload.address = v.address.trim(); if (t === 'measure') Object.assign(payload, { measure_type: v.measure_type, measure_other: (v.measure_other || '').trim(), preferred_date: v.date, preferred_time: v.time.trim() }); if (v.installation_type) payload.installation_type = v.installation_type; if (v.repair_type) payload.repair_type = v.repair_type; if (t === 'ceiling') Object.assign(payload, { area_m2: Number(v.area.replace(',', '.')), corners: Number(v.corners) }); try { const r = await request('/api/order', { method: 'POST', body: JSON.stringify(payload), timeout: 30000, headers: { 'Idempotency-Key': state.requestKey } }); const id = r.order_id ?? r.id ?? r.number; if (!id) throw Error('Сервер не вернул номер заявки'); state.successId = id; state.sending = false; state.page = 'success'; state.data = null; state.stack = []; render(); window.scrollTo(0, 0) } catch (e) { state.sendError = e.name === 'AbortError' ? 'Сервер не ответил за 30 секунд. Попробуйте повторить отправку.' : 'Не удалось подтвердить отправку заявки. Попробуйте ещё раз.'; state.sending = false; render() } }
      app.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (!el) return; const action = el.dataset.action, arg = el.dataset.arg; if (action === 'back') back(); else if (action === 'home') home(); else if (action === 'go') go(arg); else if (action === 'section') go('section', arg); else if (action === 'catalog') go('catalog', arg); else if (action === 'product') go('product', arg); else if (action === 'form') startForm(arg); else if (action === 'productOrder') startForm('product'); else if (action === 'moreCatalog') loadCatalog(state.data); else if (action === 'morePartners') loadPartners(); else if (action === 'slidePrev') { state.slide = (state.slide + photos(state.product).length - 1) % photos(state.product).length; render() } else if (action === 'slideNext') { state.slide = (state.slide + 1) % photos(state.product).length; render() } else if (action === 'choose') { state.formValues[el.dataset.name] = arg; delete state.errors[el.dataset.name]; render() } else if (action === 'external') window.open(safeUrl(arg), '_blank', 'noopener,noreferrer'); else if (action === 'privacy') { state.privacyFrom = { form: state.data, scroll: window.scrollY }; go('privacy') } });
      app.addEventListener('input', e => { const name = e.target.dataset.input; if (!name) return; let value = e.target.value; if (name === 'phone') { value = formatPhone(value); e.target.value = value } state.formValues[name] = value; if (state.errors[name]) { const old = state.errors[name]; validate(); if (!state.errors[name]) { const wrap = e.target.closest('.field'); wrap.classList.remove('error'); wrap.querySelector('.error-text')?.remove() } else state.errors[name] = old } });
      app.addEventListener('submit', e => { if (e.target.id === 'order-form') { e.preventDefault(); submitOrder() } });
      // Auto-load further pages near the bottom; explicit "Показать ещё" is a fallback.
      let scrollPending = false; window.addEventListener('scroll', () => { if (scrollPending) return; scrollPending = true; requestAnimationFrame(() => { scrollPending = false; if (document.documentElement.scrollHeight - window.scrollY - window.innerHeight < 500) { if (state.page === 'catalog') loadCatalog(state.data); if (state.page === 'partners') loadPartners() } }) });
      // Back from privacy retains the form values; ordinary back from an order form clears them.
      const oldBack = back; back = function () { if (state.page === 'privacy' && state.stack.length) { const prev = state.stack.pop(); state.page = prev.page; state.data = prev.data; state.error = ''; render(); requestAnimationFrame(() => window.scrollTo(0, prev.scroll || 0)); return } oldBack() };
      render();
    </script>
  </body>
